[project]
name = "daily-report"
version = "0.1.0"
description = "Slack 일일보고 봇"
requires-python = ">=3.12"
dependencies = [
    "apscheduler<4",
    "holidays>=0.107",
    "openai>=3.40.0",
    "python-dotenv>=1.2.4",
    "slack-bolt>=1.30.0",
    "tzdata>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
